apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-ingress
  namespace: notes-manager
  annotations:
    # This tells NGINX to rewrite the URL path
    # For example, /api/notes → /notes inside the backend
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: notes.local
      http:
        paths:
          # This rule routes normal web requests (frontend)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          # This rule routes API calls to the backend
          # Example: notes.local/api/notes → backend-service:5000/notes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
